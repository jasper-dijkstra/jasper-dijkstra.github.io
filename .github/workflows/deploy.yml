name: Deploy to GitHub Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || {
            echo "Tag v$tag does not match package.json version $version." >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Collect site
        run: |
          mkdir _site
          cp -R index.html werk.html photos.yml assets images _site/
          [ -f favicon.svg ] && cp favicon.svg _site/favicon.svg || true
          [ -f CNAME ] && cp CNAME _site/CNAME || true

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
